[package]
name = "grabstuff"
version = "0.1.0"
edition = "2021"
description = "CLI tool to query, slice, and compile content from local files"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
globset = "0.4"
rayon = "1.10"
memchr = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
arboard = "3"
anyhow = "1"
dirs = "5"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
